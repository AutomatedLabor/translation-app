name: Build, Sign and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Prevent two concurrent release builds from racing (Council P0-2).
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Validate Gradle wrapper jar
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6  # v3

      - name: "Scan for leaked secrets (gitleaks, fail-closed)"
        # v1.4.0 confirmed clean ("no leaks found"). Now fail-closed: any secret (PAT,
        # keystore password, API key) committed blocks the build. (Council P1-4 / supply-chain.)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 platforms;android-31'

      - name: Put build-tools (apksigner, aapt) on PATH
        run: |
          set -euo pipefail
          BT="$(ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools/"* | sort -V | tail -1)"
          echo "build-tools dir: $BT"
          echo "$BT" >> "$GITHUB_PATH"

      - name: "Decode release keystore (fail-closed)"
        env:
          TRANSLATOR_KEYSTORE_BASE64: ${{ secrets.TRANSLATOR_KEYSTORE_BASE64 }}
          TRANSLATOR_KEYSTORE_PASSWORD: ${{ secrets.TRANSLATOR_KEYSTORE_PASSWORD }}
          TRANSLATOR_KEY_ALIAS: ${{ secrets.TRANSLATOR_KEY_ALIAS }}
          TRANSLATOR_KEY_PASSWORD: ${{ secrets.TRANSLATOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TRANSLATOR_KEYSTORE_BASE64:-}" ]; then
            echo "::error::TRANSLATOR_KEYSTORE_BASE64 secret is not set; refusing to build."
            exit 1
          fi
          if [ -z "${TRANSLATOR_KEYSTORE_PASSWORD:-}" ] || [ -z "${TRANSLATOR_KEY_ALIAS:-}" ] || [ -z "${TRANSLATOR_KEY_PASSWORD:-}" ]; then
            echo "::error::One or more keystore secrets are empty; aborting."
            exit 1
          fi
          echo "${TRANSLATOR_KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/translator-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/translator-release.jks"
            echo "storePassword=$TRANSLATOR_KEYSTORE_PASSWORD"
            echo "keyAlias=$TRANSLATOR_KEY_ALIAS"
            echo "keyPassword=$TRANSLATOR_KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/keystore.properties"
          echo "keystore staged (jks in RUNNER_TEMP, properties at repo root)."
          keytool -list -keystore "$RUNNER_TEMP/translator-release.jks" \
            -storepass "$TRANSLATOR_KEYSTORE_PASSWORD" -alias "$TRANSLATOR_KEY_ALIAS" >/dev/null 2>&1 \
            || { echo "::error::keystore/password/alias mismatch — check TRANSLATOR_KEYSTORE_* secrets"; exit 1; }
          echo "keystore smoke-check passed."

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run lint (report, non-failing)
        continue-on-error: true
        run: ./gradlew :app:lintRelease --no-daemon --stacktrace

      - name: Build release APK (R8 + ABI splits)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release AAB (Play Store bundle)
        # v2.1.0 Phase 5: produce an Android App Bundle for Play Console upload.
        # AGP leaves the bundle unsigned (signingConfig=null when CI=true); the next
        # step signs it with jarsigner (AABs use JAR/v1 signing — apksigner is APK-only).
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: "Zipalign + sign release APKs (v2+v3 for Android 7+)"
        # In CI, AGP leaves the release APK unsigned (signingConfig=null when CI=true) +
        # zipaligned. We sign it here with apksigner forcing v2+v3. v2 is REQUIRED for
        # Android 7-8 (API 24-27 — v3 alone fails to install there); v3 covers Android 9+.
        # v1 (JAR signing) is NOT produced: apksigner refuses v1 for minSdk >= 24, and v1
        # is unnecessary (the app's minSdk is 24, so it never installs on API < 24 where
        # v1 would be needed). Inspect with `apksigner verify`; `keytool -printcert` will
        # report a false "Not a signed jar file" (v1-only tool). (v1.4.0: minSdk 24.)
        env:
          TRANSLATOR_KEYSTORE_PASSWORD: ${{ secrets.TRANSLATOR_KEYSTORE_PASSWORD }}
          TRANSLATOR_KEY_ALIAS: ${{ secrets.TRANSLATOR_KEY_ALIAS }}
          TRANSLATOR_KEY_PASSWORD: ${{ secrets.TRANSLATOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          REL="app/build/outputs/apk/release"
          KS="$RUNNER_TEMP/translator-release.jks"
          for APK in "$REL"/*.apk; do
            NAME="$(basename "$APK")"
            echo "=== zipalign + v2+v3 sign $NAME ==="
            # Re-zipalign (idempotent on AGP's already-aligned output) — good practice
            # (aligned APK mmaps better) + avoids apksigner alignment warnings.
            zipalign -f 4 "$APK" "$APK.aligned"
            mv "$APK.aligned" "$APK"
            apksigner sign \
              --ks "$KS" \
              --ks-pass "pass:$TRANSLATOR_KEYSTORE_PASSWORD" \
              --ks-key-alias "$TRANSLATOR_KEY_ALIAS" \
              --key-pass "pass:$TRANSLATOR_KEY_PASSWORD" \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$APK"
            echo "signed $NAME (v2+v3)"
          done

      - name: "Verify release APK signing (fail-closed, every variant)"
        run: |
          set -euo pipefail
          shopt -s nullglob
          REL="app/build/outputs/apk/release"
          echo "=== release APK variants found ==="
          ls -lh "$REL"/*.apk
          APK_COUNT=$(ls "$REL"/*.apk 2>/dev/null | wc -l)
          [ "$APK_COUNT" -gt 0 ] || { echo "::error::no release APKs found at $REL"; exit 1; }
          for APK in "$REL"/*.apk; do
            NAME="$(basename "$APK" .apk)"
            echo "=== verifying $NAME ==="
            apksigner verify --print-certs --verbose "$APK" | tee "apksigner-verify-$NAME.txt"
            grep -q "^Verifies$" "apksigner-verify-$NAME.txt" || { echo "::error::$NAME NOT Verifies"; exit 1; }
            # v2+v3 required for Android 7+ (minSdk 24): v2 covers Android 7-8 (API 24-27),
            # v3 covers Android 9+ (API 28+). v1 (JAR signing) is NOT produced — apksigner
            # refuses v1 for minSdk >= 24 (v1 is for API < 24, which the app doesn't support).
            grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "apksigner-verify-$NAME.txt" || { echo "::error::$NAME v2 not verified (Android 7-8 need it)"; exit 1; }
            grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" "apksigner-verify-$NAME.txt" || { echo "::error::$NAME v3 not verified (Android 9+ need it)"; exit 1; }
            grep -q "Verified using v1 scheme (JAR signing): true" "apksigner-verify-$NAME.txt" && echo "  v1=true (keytool also works)" || echo "  v1=false (inspect with apksigner, not keytool)"
            grep -q "CN=Screen Translator Release" "apksigner-verify-$NAME.txt" || { echo "::error::$NAME wrong DN"; exit 1; }
            if grep -q "CN=Android Debug" "apksigner-verify-$NAME.txt"; then echo "::error::$NAME debug key"; exit 1; fi
            ACTUAL="$(grep -E 'certificate SHA-256 digest:' "apksigner-verify-$NAME.txt" | sed -E 's/.*certificate SHA-256 digest: ([a-f0-9]+).*/\1/' | head -1)"
            EXPECTED="a0b5e5f35ee134d2816a24cc467297b3024ea466f1d5d98c0104b3e8b7e27fa2"
            [ -n "$ACTUAL" ] || { echo "::error::$NAME could not parse cert SHA-256"; exit 1; }
            [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::$NAME cert SHA-256 mismatch (expected $EXPECTED got $ACTUAL) — KEY ROTATION?"; exit 1; }
            echo "OK: $NAME — Verifies, v2+v3, DN=Screen Translator Release, cert matches baseline."
          done
          # Concatenate every variant's verify output into one release artifact.
          cat apksigner-verify-*.txt > apksigner-verify.txt
          echo "::notice::All $APK_COUNT release variant(s) signing-verified."

      - name: "Sign + verify release AAB (Play Store bundle, non-blocking)"
        # v2.1.0 Phase 5: sign the .aab with jarsigner (JAR/v1 signing — the only scheme
        # AABs support; apksigner is APK-only). Play Console re-signs the bundle with the
        # app's signing key on upload, so this is the upload-key signature.
        # continue-on-error: an AAB signing failure must NOT break the APK release
        # pipeline (the APKs are already signed + verified above). The .aab is uploaded as
        # a separate artifact (if-no-files-found: ignore) so a failure just omits it.
        continue-on-error: true
        env:
          TRANSLATOR_KEYSTORE_PASSWORD: ${{ secrets.TRANSLATOR_KEYSTORE_PASSWORD }}
          TRANSLATOR_KEY_ALIAS: ${{ secrets.TRANSLATOR_KEY_ALIAS }}
          TRANSLATOR_KEY_PASSWORD: ${{ secrets.TRANSLATOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/translator-release.jks"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "::warning::no release AAB found at $AAB; skipping AAB signing"
            exit 0
          fi
          # Sign to a temp file then move (jarsigner won't overwrite in place reliably).
          jarsigner -keystore "$KS" \
            -storepass "$TRANSLATOR_KEYSTORE_PASSWORD" \
            -keypass "$TRANSLATOR_KEY_PASSWORD" \
            -signedjar "$AAB.signed" "$AAB" "$TRANSLATOR_KEY_ALIAS"
          mv "$AAB.signed" "$AAB"
          jarsigner -verify "$AAB" || { echo "::error::AAB signature verify failed"; exit 1; }
          # Record the AAB's SHA-256 + cert for the release record.
          sha256sum "$AAB" | tee "aab-sha256.txt"
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA-256" | tee "aab-certs.txt" || true
          echo "AAB signed + verified (jarsigner)"

      - name: "Generate SHA-256 sidecars + stage release assets"
        run: |
          set -euo pipefail
          shopt -s nullglob
          REL="app/build/outputs/apk/release"
          STAGE="$GITHUB_WORKSPACE"
          for APK in "$REL"/*.apk; do
            NAME="$(basename "$APK" .apk)"
            case "$NAME" in
              *arm64-v8a*) ASSET="screen-translator-v2.1.0-arm64-v8a-release" ;;
              *universal*) ASSET="screen-translator-v2.1.0-universal-release" ;;
              *)           ASSET="screen-translator-v2.1.0-release" ;;
            esac
            ( cd "$REL" && sha256sum "$(basename "$APK")" > "$ASSET.apk.sha256" )
            cp "$APK" "$STAGE/$ASSET.apk"
            cp "$REL/$ASSET.apk.sha256" "$STAGE/$ASSET.apk.sha256"
            echo "staged $ASSET.apk ($(wc -c < "$STAGE/$ASSET.apk") bytes)  sha256: $(awk '{print $1}' "$STAGE/$ASSET.apk.sha256")"
          done
          # Badging from the arm64 variant (primary); fall back to universal.
          ARM="$STAGE/screen-translator-v2.1.0-arm64-v8a-release.apk"
          [ -f "$ARM" ] || ARM="$STAGE/screen-translator-v2.1.0-universal-release.apk"
          aapt dump badging "$ARM" | head -25 | tee badging.txt

      - name: Upload release APKs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: screen-translator-release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
            apksigner-verify-*.txt
            apksigner-verify.txt
            badging.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: screen-translator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload release AAB artifact (Play Store bundle)
        # v2.1.0 Phase 5: the signed .aab for Play Console upload. Non-fatal — the AAB
        # sign step is continue-on-error, so if signing failed this artifact is simply
        # absent (if-no-files-found: ignore) rather than failing the whole build.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: screen-translator-release-aab
          path: |
            app/build/outputs/bundle/release/*.aab
            aab-sha256.txt
            aab-certs.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: v2.1.0
          name: "Screen Translator v2.1.0 (phases 3-6 completion)"
          files: |
            screen-translator-v2.1.0-arm64-v8a-release.apk
            screen-translator-v2.1.0-arm64-v8a-release.apk.sha256
            screen-translator-v2.1.0-universal-release.apk
            screen-translator-v2.1.0-universal-release.apk.sha256
            apksigner-verify.txt
            badging.txt
          body: |
            # Screen Translator v2.1.0 — phases 3-6 completion

            Built from commit `${{ github.sha }}`.

            ## What changed in v2.1.0

            This release completes the v2.0 roadmap phases 3-6 (everything achievable
            without a physical device for hands-on testing).

            ### Phase 3 — onboarding + status dashboard + help
            - **Live status dashboard.** The setup screen now opens with a Status card
              showing "Live translation: Active/Inactive" (polled once per second) and the
              current source → target language pair, so the user always knows whether
              translation is running.
            - **Help & FAQ card** with a concise usage summary (tile toggle, ✕ drag,
              Stop action, auto-hide).
            - (Onboarding dialog + in-app update check shipped in v2.0.2/v2.0.3.)

            ### Phase 4 — overlay improvements + translation history
            - **Draggable close button.** The ✕ can now be dragged anywhere on screen
              ( WindowManager.updateViewLayout) so it does not cover translated content;
              a tap (movement within touch slop) still closes, a drag repositions.
            - **Auto-hide.** In continuous mode, the overlay auto-dismisses after 90s of
              inactivity so it does not linger over a stale screen.
            - **Translation history** (on-device, private, clearable). The last 50
              translations are persisted as JSON in `filesDir` (no Room/KSP dependency —
              avoids the artifact-resolution risk that reverted the v2.0.4 splash). View
              the 5 most recent in the History card; Clear button wipes the file.

            ### Phase 5 — crash reporting + Play Store prep + tests
            - **Local crash logger.** A `Thread.UncaughtExceptionHandler` (installed in
              `App.onCreate`) writes the stack trace to `filesDir/crashes/` (bounded to
              5 files, pruned newest-kept). No telemetry, no network — the user shares a
              crash log explicitly via the Crash logs card (share-as-text, no FileProvider).
            - **AAB (Play Store bundle).** CI now builds + jarsigner-signs a release
              `.aab` (uploaded as an artifact, non-blocking so an AAB issue cannot break
              the APK release).
            - **Unit tests** for `TranslationHistory` (round-trip, dedupe, cap, clear) and
              `CrashLogger` (write, newest-first, prune).

            ### Phase 6 — a11y, widget, notification action, splash, OSS docs
            - **TalkBack.** The translation overlay now exposes a contentDescription (the
              concatenated translated texts) so it is not announced as a silent graphic.
            - **Home-screen widget.** A 1×1 "Translate" widget toggles live translation
              (service ready) or opens setup (service not ready).
            - **Notification Stop action.** The continuous-mode notification has a "Stop"
              button (via a `BroadcastReceiver`) so the user can stop from the shade
              without pulling down to the tile.
            - **Splash screen (redone safely).** Uses the platform SplashScreen API
              (`windowSplashScreen*` theme attributes, API 31+) — pure XML, NO
              `androidx.core:core-splashscreen` dependency (that artifact failed to
              resolve on CI in v2.0.4, which is why the splash was reverted). On API < 31
              there is no splash (identical to v1.x).
            - **OSS licenses / privacy policy / data-safety form** added under `docs/`.

            ### Repo hygiene
            - The duplicate `screen-translator` repo (created by mistake in v2.0.0) is
              **archived** on GitHub; `translation-app` is the single source of truth.
            - versionCode 15 → 16, versionName 2.0.4 → 2.1.0. Same signing key
              (cert SHA-256 `a0b5e5…7fa2`); v1.1.0+ users can update in place.

            ### Not done (requires a physical device — explicitly out of scope here)
            - Hands-on device testing of the draggable ✕, widget placement, TalkBack
              reading, and the platform splash animation. CI's instrumented emulator
              covers the extraction pipeline; these UI behaviours need a real device.
            - Actual Play Console publication (needs a developer account + the signed AAB
              uploaded manually). The AAB is produced by CI as an artifact.

            ## What changed in v2.0.1

            - **Any-to-any language translation.** No longer hardcoded German→English.
              Added a SOURCE language picker (with "Auto-Detect" as the default) alongside
              the existing target picker. Auto-Detect uses ML Kit LanguageIdentification to
              identify the source language of the on-screen text automatically + creates the
              right translator pair. Manual source selection (German, English, French, etc.)
              is also available.
            - **Swap button.** One tap reverses source ↔ target (disabled when source is
              Auto-Detect).
            - **Engine refactor.** MlKitTranslationEngine now takes (sourceLanguageTag,
              targetLanguageTag). shouldTranslate skips the TARGET language (not just English).
              resolveSourceLanguage() detects + caches the source for auto-detect.
              isModelDownloaded checks the source→target pair.
            - **Live source switching.** The service exposes updateSourceLanguage(tag) —
              the tile picks up source changes without re-enabling accessibility.
            - versionCode 11 → 12, versionName 2.0.0 → 2.0.1.

            ## What changed in v2.0.0

            Built from commit `${{ github.sha }}`.

            ## What changed in v2.0.0

            - **ARCHITECTURE DECISION: keep AccessibilityService (NOT MediaProjection).**
              The v2.0 spec described a MediaProjection + OCR pipeline, but MediaProjection
              CANNOT capture FLAG_SECURE windows (banking / DHL / parcel apps show black
              screens) — the exact problem the accessibility approach was chosen to bypass.
              Switching would break the app's core use case. The accessibility pipeline is
              verified working (instrumented emulator test passes). MediaProjection + OCR
              for image-text is a future fallback (needs device testing for the consent /
              foreground-service flow).
            - **ISSUE 1 FIX (tile does nothing): diagnostic Toasts at every failure point.**
              The #1 cause of "tap the tile, nothing happens" was a SILENT failure in the
              pipeline — pickTargetWindow returns null (no app window), no root, no text
              regions, or nothing translated — all returned with ZERO user feedback. Now each
              failure shows a Toast explaining WHY: "No app window found — open an app first",
              "No text found on screen", "Nothing to translate — is the model downloaded? Is
              the text in the source language?". The model-missing Toast (v1.6.0) + these
              new Toasts cover every failure mode. The user now knows exactly what to fix.
            - **New repo: github.com/AutomatedLabor/screen-translator** (renamed from
              translation-app; same signing key cert SHA-256 a0b5e5…7fa2, same CI, same
              secrets re-added).
            - versionCode 10 → 11, versionName 1.9.0 → 2.0.0.

            ## What changed in v1.9.0

            - **Continuous-mode notification.** When live translation starts, the service now
              posts a persistent, silent, ongoing notification ("Screen Translator — Live
              translation active — tap ✕ or the tile to stop") so the user can see it's running
              in the shade. Cancelled when continuous mode stops. Created a NotificationChannel
              (IMPORTANCE_LOW, API 26+).
            - **POST_NOTIFICATIONS permission** (Android 13+). Added to the manifest + a
              one-time runtime request in MainActivity.onCreate (gated on not-already-granted).
              On Android < 13, notifications work without asking.
            - versionCode 9 → 10, versionName 1.8.0 → 1.9.0.

            ## What changed in v1.8.0

            - **UI localization (German + Urdu).** Added `values-de/strings.xml` +
              `values-ur/strings.xml` (all 27 UI strings translated). The app now renders its
              setup UI in the device's locale (en/de/ur). Added `res/xml/locales_config.xml` +
              `android:localeConfig` in the manifest for Android 13+ per-app locale. RTL (Urdu)
              is supported (`supportsRtl=true` was already set).
            - **Repo health files.** CONTRIBUTING.md, CODE_OF_CONDUCT.md (Contributor Covenant
              2.1), SECURITY.md (vulnerability disclosure via GitHub Security Advisories, with
              the release cert SHA-256 for APK verification), CHANGELOG.md (Keep-a-Changelog,
              v1.0.0→v1.7.0).
            - **Issue + PR templates.** `.github/ISSUE_TEMPLATE/bug_report.md` (with the
              model-downloaded + accessibility-service + tile-behavior checklist),
              `feature_request.md`, `PULL_REQUEST_TEMPLATE.md`.
            - **Dependabot.** `.github/dependabot.yml` — weekly updates for github-actions +
              gradle deps, grouped minor+patch, conventional-commit prefixes.
            - **README architecture diagram.** Added a Mermaid flowchart tracing the pipeline:
              Quick Settings tile → TranslatorAccessibilityService → (pickTargetWindow →
              ScreenTextExtractor → MlKitTranslationEngine → OverlayManager).
            - versionCode 8 → 9, versionName 1.7.0 → 1.8.0. (APK behavior identical to v1.7.0 —
              only UI strings + resource config changed.)

            ## What changed in v1.7.0

            - **Instrumented test on a real emulator (the "test it yourself" job).** Added a
              CI job that boots an x86_64 Android emulator (API 30, with KVM on the GitHub
              runner — no KVM in the local sandbox) + runs `connectedDebugAndroidTest`. New
              test `extractorWalksRealAccessibilityTree` launches the German `FlagSecureTestActivity`,
              obtains a live `AccessibilityNodeInfo` root via UiAutomation (the same source the
              accessibility service uses), runs the REAL `ScreenTextExtractor.extract()` against
              it, + asserts the German text is found. This is the closest an automated test can
              get to the on-device extraction pipeline without enabling the accessibility service.
            - `reactivecircus/android-emulator-runner` pinned to a commit SHA (supply-chain).
            - versionCode 7 → 8, versionName 1.6.0 → 1.7.0. (APK behavior identical to v1.6.0 —
              the instrumented test is in the androidTest sourceset, not the shipped app.)

            ## What changed in v1.6.0

            - **Continuous (live) translation mode.** The tile now TOGGLES live translation: tap
              once to start (the overlay persists + updates smoothly as on-screen text changes
              — e.g. a chat where new German messages arrive), tap again or ✕ to stop. No more
              one-shot + auto-dismiss. On `typeWindowContentChanged` / `typeViewScrolled` /
              `typeViewTextChanged` from the target app, the service debounces (400ms) +
              re-snapshots + re-translates + **smoothly updates** the overlay in-place via a new
              `OverlayManager.update()` (no dismiss+re-add flicker). The accessibility config
              now includes `typeViewTextChanged`.
            - **Model-downloaded check (the #1 "tile does nothing" fix).** If you tap the tile
              before downloading the German→target ML Kit model, the service now shows a Toast:
              "Download the model first — open the app and tap Download model." Previously it
              silently translated nothing (the model-missing error was swallowed + regions
              filtered out), which is the most likely cause of "I tap the tile but nothing
              translates."
            - versionCode 6 → 7, versionName 1.5.0 → 1.6.0.

            ## What changed in v1.5.0

            - **Polished README** (learned from NewPipe 40k★ / Termux 64k★): centered icon +
              tagline, badges row (CI / release / license / minSdk / targetSdk / signing),
              nav bar, generated hero image, structured sections (Features → How it works →
              Install → Architecture → Security → Verify → Build → Roadmap → License), GitHub
              callouts. Added MIT LICENSE + assets/icon.png + assets/hero.png.
            - **gitleaks fail-closed.** v1.4.0 confirmed clean ("no leaks found"); removed
              `continue-on-error` so any committed secret blocks the build.
            - **GitHub Actions pinned to commit SHAs** (supply-chain hardening — no more
              `@v4`/`@v3` mutable tags): checkout, wrapper-validation, gitleaks, setup-java,
              setup-android, cache, upload-artifact, action-gh-release.
            - versionCode 5 → 6, versionName 1.4.0 → 1.5.0.

            ## What changed in v1.4.0

            - **Android 7+ support (minSdk 24).** The app now installs on Android 7.0
              (API 24) and above — previously required Android 12 (API 31), which caused
              "parsing error" / "There was a problem parsing the package" on Android 11
              and below. Every API 26/28/30 call site is now version-guarded:
              `TileService.requestListeningState` (API 28), `unlockAndRun`/`isLocked`
              (API 26), `AccessibilityNodeInfo.hintText` (API 26),
              `LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS` (API 28),
              `GLOBAL_ACTION_DISMISS_NOTIFICATION_SHADE` (API 30). On Android 7-10 the
              shade doesn't auto-collapse (the action is API 30) — the user dismisses it
              manually and the overlay appears.
            - **v2+v3 APK signing (forced).** AGP emits v3-only, which fails to install on
              Android 7-8 (API 24-27 — v3 is Android 9+ only). CI now zipaligns + signs each
              release variant from unsigned with `apksigner sign --v2-signing-enabled true
              --v3-signing-enabled true`, producing v2 (Android 7-8) + v3 (Android 9+).
              v1 (JAR signing) is NOT produced: apksigner refuses v1 for minSdk >= 24, and
              v1 is unnecessary (the app's minSdk is 24, so it never installs on API < 24
              where v1 would matter). Inspect with `apksigner verify`; `keytool -printcert`
              will report a false "Not a signed jar file" (v1-only tool).
            - versionCode 4 → 5, versionName 1.3.0 → 1.4.0.

            ## What changed in v1.3.0

            - **Two APK variants (ABI splits).** The release now ships as **arm64-v8a**
              (~40 MB, for any 64-bit ARM phone — ~99% of devices since 2017) AND
              **universal** (~107 MB, smaller with R8 — for 32-bit ARM / x86 emulators /
              rare x86 devices). Install arm64-v8a unless install fails with
              `INSTALL_FAILED_NO_MATCHING_ABIS` (then use universal).
            - **Target language picker.** No longer hardcoded German→English. Pick the
              target in the app: German → {English, Urdu, French, Spanish, Italian,
              Portuguese, Russian, Arabic, Turkish, Hindi, Chinese, Japanese}. Persisted
              to SharedPreferences; the Quick Settings tile picks up the change live
              (the service recreates its engine) — no need to re-enable accessibility.
            - **R8 minification + resource shrinking** on release — smaller APK +
              library-code obfuscation (harder to reverse-engineer). Generous keep rules
              for the app's classes + ML Kit + GMS keep it safe.
            - **Security hardening.** `usesCleartextTraffic=false` +
              `network_security_config.xml` (block cleartext app-wide) +
              `data_extraction_rules.xml` (exclude every domain from backup/transfer,
              belt-and-suspenders on `allowBackup=false`).
            - **Debug-only fix:** `FlagSecureTestActivity` moved from the androidTest
              sourceset to the debug sourceset (was a dangling exported activity in the
              debug APK).
            - **CI hardening:** gitleaks secret scan (advisory) + `lintRelease` report.
            - versionCode 3 → 4, versionName 1.2.0 → 1.3.0.

            ## Which APK to install

            | APK | Size | Install on |
            |---|---|---|
            | `screen-translator-v2.1.0-arm64-v8a-release.apk` | ~22 MB | **Any phone from ~2017** (Pixel, Samsung, OnePlus, Xiaomi, etc. — 64-bit ARM). Try this first. |
            | `screen-translator-v2.1.0-universal-release.apk` | ~72 MB | 32-bit ARM phones (pre-2017), x86 emulators, rare x86 devices. Fallback. |

            ## Install

            1. **If you have v1.0.0 or v1.0.1 installed, uninstall it first** (the signing
               key changed in v1.1.0). **v1.1.0+ users can update in place to v1.4.0** (same
               signing key, cert SHA-256 `a0b5e5…7fa2`).
            2. Download the arm64-v8a APK (or universal if arm64 fails) to your phone.
            3. Tap to install. Accept **"Unknown sources"**.
            4. **Android 13+:** long-press app icon → App Info → ⋮ → **"Allow restricted settings"**.
            5. Settings → Accessibility → Screen Translator → enable.
            6. Open the app → pick a **target language** → tap **Download model**.
            7. Pull down the Quick Settings shade twice → edit → drag the **"Translate Screen"** tile in.
            8. Open any German app → tap the tile → German text is overlaid with your target language.

            ## How to verify the APK is signed

            Use **`apksigner verify`** for the canonical check. v1.4.0 APKs are signed
            with v2+v3 (NOT v1), so `keytool -printcert -jarfile` will report a false
            "Not a signed jar file" — use `apksigner` instead. See `apksigner-verify.txt`
            for CI's proof.

            ```
            apksigner verify --print-certs --verbose screen-translator-v2.1.0-arm64-v8a-release.apk
            # expect: Verifies, v2=true, v3=true,
            #         Signer #1 certificate DN: CN=Screen Translator Release, O=AutomatedLabor, C=US
            #         Signer #1 certificate SHA-256 digest: a0b5e5f35ee134d2816a24cc467297b3024ea466f1d5d98c0104b3e8b7e27fa2
            sha256sum -c screen-translator-v2.1.0-arm64-v8a-release.apk.sha256
            ```

            ## Verification done by CI

            - `apksigner verify` on **every** release variant → `Verifies`, **v2+v3=true**
              (v2 for Android 7-8, v3 for Android 9+ — installable on Android 7+), DN
              contains `CN=Screen Translator Release`, cert SHA-256 matches pinned baseline
              `a0b5e5…7fa2` (no key rotation), debug key explicitly rejected.
            - Unit tests + lint + **instrumented emulator tests** run on every push.

            ## Requirements

            - **Android 7.0+ (API 24)**, ~60 MB free storage (arm64 APK + ML Kit model), no Google account.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Instrumented tests on a real (emulated) Android device — the "test it yourself"
  # job. Boots an x86_64 emulator (API 30, with KVM on the GitHub runner) + runs the
  # ScreenTextExtractor against a live AccessibilityNodeInfo tree via UiAutomation,
  # verifying the extraction pipeline works on a real device (not just Robolectric).
  # ---------------------------------------------------------------------------
  instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3
        with:
          packages: 'platform-tools platforms;android-30 platforms;android-35'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM for the emulator (ubuntu-latest needs /dev/kvm perms)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0777", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Run instrumented tests on emulator (API 30, x86_64)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel auto
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: instrumented-test-results
          path: app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: ignore
